<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fisika Bab 2: Tekanan pada Zat 💧</title>
    <link rel="stylesheet" href="visual-effects.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0277bd 0%, #0288d1 30%, #039be5 60%, #03a9f4 100%);
            overflow-x: hidden;
            font-size: 17px; line-height: 1.8; color: #2c3e50;
        }

        p { font-size: 1.05em; line-height: 1.9; color: #37474f; }
        h2 { font-size: 1.6em; line-height: 1.4; }
        h3 { font-size: 1.25em; line-height: 1.4; }
        li { font-size: 1.02rem; line-height: 1.8; color: #455a64; }

        .bg-animation {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden;
            background: linear-gradient(135deg, #0277bd 0%, #0288d1 30%, #039be5 60%, #03a9f4 100%);
        }

        .bg-animation .bubble {
            position: absolute; border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            animation: floatBubble 20s infinite ease-in-out;
        }

        @keyframes floatBubble {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
            50% { transform: translateY(-100vh) rotate(360deg); opacity: 0.2; }
        }

        .back-nav {
            position: fixed; top: 20px; left: 20px; z-index: 1000;
            background: rgba(255,255,255,0.95); padding: 12px 20px; border-radius: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 10px;
            text-decoration: none; color: #0277bd; font-weight: bold; font-size: 1rem;
            transition: all 0.3s ease;
        }

        .back-nav:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,0,0,0.3); background: white; }

        /* Mapel Switcher */
        .mapel-switcher {
            position: fixed; top: 20px; right: 20px; z-index: 1000;
        }

        .mapel-switcher-btn {
            background: rgba(255,255,255,0.95); padding: 12px 20px; border-radius: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 10px;
            text-decoration: none; color: #0277bd; font-weight: bold; font-size: 1rem;
            transition: all 0.3s ease; backdrop-filter: blur(10px); cursor: pointer; border: none;
        }

        .mapel-switcher-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,0,0,0.3); background: white; }

        .mapel-dropdown {
            display: none; position: absolute; top: 100%; right: 0; margin-top: 10px;
            background: white; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            min-width: 250px; overflow: hidden; animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .mapel-dropdown.show { display: block; }

        .mapel-dropdown a {
            display: flex; align-items: center; gap: 12px; padding: 15px 20px;
            text-decoration: none; color: #333; transition: all 0.3s ease; border-bottom: 1px solid #f0f0f0;
        }

        .mapel-dropdown a:hover { background: #f5f5f5; }
        .mapel-dropdown a:last-child { border-bottom: none; }
        .mapel-dropdown a .mapel-icon { font-size: 1.5em; }
        .mapel-dropdown a .mapel-name { font-weight: 500; }

        header {
            background: linear-gradient(135deg, #01579b 0%, #0277bd 50%, #0288d1 100%);
            color: white; text-align: center; padding: 60px 20px 80px;
            position: relative; overflow: hidden;
            clip-path: polygon(0 0, 100% 0, 100% 85%, 50% 100%, 0 85%);
        }

        header h1 { font-size: 2.8em; margin-bottom: 15px; position: relative; z-index: 1; text-shadow: 3px 3px 6px rgba(0,0,0,0.3); }
        header .subtitle { font-size: 1.3em; opacity: 0.95; position: relative; z-index: 1; }

        main { max-width: 1200px; margin: -40px auto 40px; padding: 0 20px; position: relative; z-index: 10; }

        .section-box {
            background: rgba(255, 255, 255, 0.97); border-radius: 30px; padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2); margin-bottom: 40px;
        }

        .section-box h2 { color: #0277bd; font-size: 1.8em; margin-bottom: 25px; text-align: center; }
        .section-box h3 { color: #0288d1; font-size: 1.3em; margin: 25px 0 15px 0; }

        .section-box p { margin-bottom: 15px; text-align: justify; }
        .section-box ul { margin: 15px 0 15px 30px; }
        .section-box li { margin-bottom: 8px; }

        .hero-section {
            background: linear-gradient(135deg, #01579b 0%, #0277bd 50%, #0288d1 100%);
            color: white; padding: 50px 40px; border-radius: 30px; text-align: center;
            margin-bottom: 40px; position: relative; overflow: hidden;
            box-shadow: 0 20px 60px rgba(1, 87, 155, 0.4);
        }

        .hero-section h2 { font-size: 2.2em; margin-bottom: 20px; position: relative; z-index: 1; }
        .hero-section p { font-size: 1.1em; opacity: 0.95; position: relative; z-index: 1; max-width: 700px; margin: 0 auto; }

        .card-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px; margin-top: 25px;
        }

        .card {
            background: white; border-radius: 20px; padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: all 0.3s ease; text-align: center;
            border-top: 5px solid #0277bd;
        }

        .card:hover { transform: translateY(-8px); box-shadow: 0 15px 40px rgba(0,0,0,0.15); }
        .card .card-icon { font-size: 3.5em; margin-bottom: 20px; display: block; }
        .card h4 { color: #0277bd; font-size: 1.2em; margin-bottom: 15px; }
        .card p { color: #666; font-size: 0.95em; line-height: 1.6; }

        .formula-box {
            background: linear-gradient(135deg, #e1f5fe, #b3e5fc);
            border-radius: 15px; padding: 25px;
            border-left: 5px solid #0277bd;
            margin: 20px 0;
        }

        .formula-box h4 { color: #0277bd; margin-bottom: 10px; }
        .formula-box .formula { font-size: 1.5em; font-weight: bold; color: #01579b; text-align: center; margin: 15px 0; }
        .formula-box p { color: #555; font-size: 0.95em; }

        .quiz-section {
            background: linear-gradient(135deg, #fff8e1, #fff3cd);
            border-radius: 30px; padding: 40px; margin-top: 40px;
            border: 3px solid #ffc107;
        }

        .quiz-section h2 { color: #f57f17; }

        .quiz-question {
            background: white; padding: 25px; border-radius: 20px;
            margin-bottom: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .quiz-question p { font-weight: bold; font-size: 1.1em; color: #333; margin-bottom: 15px; }

        .quiz-options { display: flex; flex-direction: column; gap: 12px; }

        .quiz-option {
            display: flex; align-items: center; gap: 12px;
            padding: 15px; background: #f8f9fa; border-radius: 12px;
            cursor: pointer; transition: all 0.3s ease; border: 2px solid transparent;
        }

        .quiz-option:hover { background: #e1f5fe; border-color: #4fc3f7; transform: translateX(5px); }
        .quiz-option input[type="radio"] { width: 20px; height: 20px; accent-color: #0277bd; }

        .quiz-btn {
            display: block; margin: 30px auto 0; padding: 18px 50px;
            background: linear-gradient(135deg, #0277bd, #039be5);
            color: white; border: none; border-radius: 30px;
            font-size: 1.2em; font-weight: bold; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 5px 20px rgba(2, 119, 189, 0.4);
        }

        .quiz-btn:hover { transform: translateY(-3px) scale(1.05); }

        .quiz-result {
            margin-top: 25px; padding: 25px; border-radius: 20px;
            text-align: center; display: none; font-size: 1.1em;
        }

        .quiz-result.show { display: block; animation: fadeInUp 0.5s ease; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .quiz-result.excellent { background: linear-gradient(135deg, #c8e6c9, #a5d6a7); border: 3px solid #4caf50; color: #1b5e20; }
        .quiz-result.good { background: linear-gradient(135deg, #fff9c4, #fff59d); border: 3px solid #ffeb3b; color: #f57f17; }
        .quiz-result.try-again { background: linear-gradient(135deg, #ffcdd2, #ef9a9a); border: 3px solid #f44336; color: #b71c1c; }

        footer {
            background: linear-gradient(135deg, #0d1b2a 0%, #01579b 100%);
            color: white; text-align: center; padding: 40px 20px; position: relative;
        }

        footer::before {
            content: ''; position: absolute; top: -30px; left: 0; right: 0; height: 30px;
            background: linear-gradient(135deg, #0d1b2a 0%, #01579b 100%);
            clip-path: polygon(0 100%, 50% 0, 100% 100%);
        }

        .footer-content { max-width: 800px; margin: 0 auto; }
        .footer-logo { font-size: 2.5em; margin-bottom: 15px; }
        footer h3 { font-size: 1.5em; margin-bottom: 10px; color: #ffd700; }
        footer p { color: rgba(255,255,255,0.8); margin-bottom: 8px; }

        .footer-links { display: flex; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .footer-links a { color: #ffd700; text-decoration: none; font-weight: bold; }
        .footer-links a:hover { color: white; text-decoration: underline; }

        @media (max-width: 768px) {
            header h1 { font-size: 2em; }
            .card-grid { grid-template-columns: 1fr; }
            .section-box { padding: 30px 20px; }
            .hero-section { padding: 30px 20px; }
            .hero-section h2 { font-size: 1.6em; }
            .mapel-switcher { top: 70px; right: 10px; }
            .mapel-switcher-btn { padding: 10px 15px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="bg-animation" id="bgAnimation"></div>

    <a href="ipa-fisika.html" class="back-nav">← Kembali ke Fisika</a>

    <!-- Mapel Switcher -->
