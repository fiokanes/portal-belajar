<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis & Game Matematika 🔢</title>
    <link rel="stylesheet" href="visual-effects.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #00897b 0%, #26a69a 30%, #4db6ac 60%, #80cbc4 100%);
            overflow-x: hidden;
            font-size: 17px; line-height: 1.8; color: #2c3e50;
        }

        .bg-animation {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden;
            background: linear-gradient(135deg, #00897b 0%, #26a69a 30%, #4db6ac 60%, #80cbc4 100%);
        }

        .bg-animation .bubble {
            position: absolute; border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            animation: floatBubble 20s infinite ease-in-out;
        }

        @keyframes floatBubble {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
            50% { transform: translateY(-100vh) rotate(360deg); opacity: 0.2; }
        }

        .back-nav {
            position: fixed; top: 20px; left: 20px; z-index: 1000;
            background: rgba(255,255,255,0.95); padding: 12px 20px; border-radius: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 10px;
            text-decoration: none; color: #00897b; font-weight: bold; font-size: 1rem;
            transition: all 0.3s ease;
        }

        .back-nav:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,0,0,0.3); background: white; }

        header {
            background: linear-gradient(135deg, #00695c 0%, #00897b 50%, #009688 100%);
            color: white; text-align: center; padding: 60px 20px 80px;
            position: relative; overflow: hidden;
            clip-path: polygon(0 0, 100% 0, 100% 85%, 50% 100%, 0 85%);
        }

        header h1 { font-size: 3em; margin-bottom: 15px; position: relative; z-index: 1; text-shadow: 3px 3px 6px rgba(0,0,0,0.3); }
        header .subtitle { font-size: 1.3em; opacity: 0.95; position: relative; z-index: 1; }

        main { max-width: 1200px; margin: -40px auto 40px; padding: 0 20px; position: relative; z-index: 10; }

        .section-box {
            background: rgba(255, 255, 255, 0.97); border-radius: 30px; padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2); margin-bottom: 40px;
        }

        .section-box h2 { color: #00897b; font-size: 1.8em; margin-bottom: 25px; text-align: center; }

        .game-tabs {
            display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; flex-wrap: wrap;
        }

        .game-tab {
            padding: 12px 25px; border-radius: 25px; border: 2px solid #00897b;
            background: white; color: #00897b; font-weight: bold; cursor: pointer;
            transition: all 0.3s ease; font-size: 1rem;
        }

        .game-tab:hover, .game-tab.active {
            background: #00897b; color: white; transform: translateY(-3px);
        }

        #quizContainer, #gameContainer {
            min-height: 300px;
        }

        .quiz-question {
            background: white; padding: 25px; border-radius: 20px;
            margin-bottom: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-left: 5px solid #00897b;
        }

        .quiz-question p { font-weight: bold; font-size: 1.1em; color: #333; margin-bottom: 15px; }

        .quiz-options { display: flex; flex-direction: column; gap: 12px; }

        .quiz-option {
            display: flex; align-items: center; gap: 12px;
            padding: 15px; background: #f8f9fa; border-radius: 12px;
            cursor: pointer; transition: all 0.3s ease; border: 2px solid transparent;
        }

        .quiz-option:hover { background: #e0f2f1; border-color: #4db6ac; transform: translateX(5px); }
        .quiz-option input[type="radio"] { width: 20px; height: 20px; accent-color: #00897b; }

        .quiz-btn {
            display: block; margin: 30px auto 0; padding: 18px 50px;
            background: linear-gradient(135deg, #00897b, #26a69a);
            color: white; border: none; border-radius: 30px;
            font-size: 1.2em; font-weight: bold; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 5px 20px rgba(0, 137, 123, 0.4);
        }

        .quiz-btn:hover { transform: translateY(-3px) scale(1.05); }

        .quiz-result {
            margin-top: 25px; padding: 25px; border-radius: 20px;
            text-align: center; display: none; font-size: 1.1em;
        }

        .quiz-result.show { display: block; animation: fadeInUp 0.5s ease; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .quiz-result.excellent { background: linear-gradient(135deg, #c8e6c9, #a5d6a7); border: 3px solid #4caf50; color: #1b5e20; }
        .quiz-result.good { background: linear-gradient(135deg, #fff9c4, #fff59d); border: 3px solid #ffeb3b; color: #f57f17; }
        .quiz-result.try-again { background: linear-gradient(135deg, #ffcdd2, #ef9a9a); border: 3px solid #f44336; color: #b71c1c; }

        .game-content {
            text-align: center; padding: 30px;
        }

        .game-content h3 { color: #00897b; font-size: 1.5em; margin-bottom: 20px; }
        .game-score { font-size: 1.2em; color: #666; margin-bottom: 20px; }
        .game-question { font-size: 1.1em; color: #333; margin-bottom: 25px; }

        .scrambled-word {
            font-size: 2.5em; font-weight: bold; color: #00897b;
            letter-spacing: 10px; margin: 20px 0; padding: 20px;
            background: #e0f2f1; border-radius: 15px;
        }

        .game-input {
            padding: 15px 25px; font-size: 1.2em; border: 3px solid #00897b;
            border-radius: 15px; width: 100%; max-width: 300px; text-align: center;
            margin-bottom: 15px;
        }

        .game-hint { color: #888; font-size: 0.9em; margin-top: 15px; }

        .game-options {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;
            max-width: 600px; margin: 0 auto;
        }

        .game-option-btn {
            padding: 15px 20px; border: 2px solid #00897b; background: white;
            border-radius: 15px; font-size: 1em; cursor: pointer;
            transition: all 0.3s ease; color: #00897b; font-weight: bold;
        }

        .game-option-btn:hover { background: #00897b; color: white; transform: scale(1.05); }

        .timer {
            font-size: 2em; color: #f44336; font-weight: bold; margin: 20px 0;
        }

        .game-complete {
            text-align: center; padding: 40px;
        }

        .game-complete h3 { color: #00897b; font-size: 2em; margin-bottom: 20px; }

        footer {
            background: linear-gradient(135deg, #0d1b2a 0%, #00695c 100%);
            color: white; text-align: center; padding: 40px 20px; position: relative;
        }

        footer::before {
            content: ''; position: absolute; top: -30px; left: 0; right: 0; height: 30px;
            background: linear-gradient(135deg, #0d1b2a 0%, #00695c 100%);
            clip-path: polygon(0 100%, 50% 0, 100% 100%);
        }

        .footer-content { max-width: 800px; margin: 0 auto; }
        .footer-logo { font-size: 2.5em; margin-bottom: 15px; }
        footer h3 { font-size: 1.5em; margin-bottom: 10px; color: #ffd700; }
        footer p { color: rgba(255,255,255,0.8); margin-bottom: 8px; }

        .footer-links { display: flex; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .footer-links a { color: #ffd700; text-decoration: none; font-weight: bold; }
        .footer-links a:hover { color: white; text-decoration: underline; }

        @media (max-width: 768px) {
            header h1 { font-size: 2em; }
            .section-box { padding: 25px 15px; }
            .game-options { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="bg-animation" id="bgAnimation"></div>

    <a href="belajar-aritmatika.html" class="back-nav">← Kembali ke Matematika</a>

    <header>
        <h1>🔢 KUIS & GAME MATEMATIKA</h1>
        <p class="subtitle">Uji pemahamanmu dengan kuis dan game interaktif!</p>
    </header>

    <main>
        <section class="section-box">
            <h2>🎯 Pilih Mode</h2>
            
            <div class="game-tabs">
                <button class="game-tab active" onclick="showQuiz()">📝 Kuis</button>
                <button class="game-tab" onclick="showGame('word')">🔤 Tebak Kata</button>
                <button class="game-tab" onclick="showGame('quick')">⚡ Kuis Cepat</button>
            </div>

            <div id="quizContainer"></div>
            <div id="gameContainer" style="display: none;"></div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-logo">🔢</div>
            <h3>KUIS & GAME MATEMATIKA</h3>
            <p>Belajar Matematika Jadi Menyenangkan!</p>
            <div class="footer-links">
                <a href="index.html">📚 Portal Utama</a>
                <a href="belajar-aritmatika.html">📐 Matematika</a>
            </div>
        </div>
    </footer>

    <script src="quiz-game-system.js"></script>
    <script>
        function showQuiz() {
            document.getElementById('quizContainer').style.display = 'block';
            document.getElementById('gameContainer').style.display = 'none';
            document.querySelectorAll('.game-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.game-tab')[0].classList.add('active');
            QuizSystem.createQuiz('matematika', 'quizContainer', 5);
        }

        function showGame(type) {
            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('gameContainer').style.display = 'block';
            document.querySelectorAll('.game-tab').forEach(t => t.classList.remove('active'));
            
            if (type === 'word') {
                document.querySelectorAll('.game-tab')[1].classList.add('active');
                const words = ['penjumlahan', 'pengurangan', 'perkalian', 'pembagian', 'bilangan', 'positif', 'negatif', 'nol'];
                QuizSystem.createWordGame('gameContainer', words);
            } else {
                document.querySelectorAll('.game-tab')[2].classList.add('active');
                QuizSystem.createQuickQuiz('gameContainer', QuizSystem.quizDatabase.matematika);
            }
        }

        // Load quiz on page load
        showQuiz();
    </script>
<script src="mapel-switcher.js"></script>
<script src="click-sounds.js"></script>
<script src="emoji-effects.js"></script>
</body>
</html>
